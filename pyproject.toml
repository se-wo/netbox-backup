[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-backup"
version = "0.2.0.dev0"
description = "Open-source backup, verification and disaster recovery for NetBox"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "netbox-backup contributors" }]
keywords = ["netbox", "netbox-plugin", "backup", "disaster-recovery", "postgresql"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
# The core install pulls no cloud SDKs; encryption and signatures use the gpg binary (GnuPG 2.4+)
dependencies = [
    "croniter>=2.0",
    "zstandard>=0.22",
    "psycopg>=3.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
gcs = ["google-cloud-storage>=2.18"]
sftp = ["asyncssh>=2.14"]
# rclone needs no Python package: install the rclone binary and pin its SHA-256 in the target
all = [
    "boto3>=1.35", "azure-storage-blob>=12.19", "azure-identity>=1.15", "google-cloud-storage>=2.18",
    "asyncssh>=2.14",
]

[project.scripts]
netbox-backup = "netbox_backup.cli:main"

[project.urls]
Homepage = "https://github.com/se-wo/netbox-backup"
Documentation = "https://github.com/se-wo/netbox-backup/tree/main/docs"

[tool.setuptools.packages.find]
include = ["netbox_backup*"]

[tool.setuptools.package-data]
netbox_backup = ["templates/**/*.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RET"]
ignore = ["RET504"]

[tool.ruff.lint.isort]
known-third-party = ["netbox", "core", "dcim", "extras", "users", "utilities"]
known-first-party = ["netbox_backup"]
