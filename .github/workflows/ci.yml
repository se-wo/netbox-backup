name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check netbox_backup

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each NetBox release against its minimum supported PostgreSQL and a current one
          - netbox: 'v4.4.9'
            postgres: '14'
          - netbox: 'v4.4.9'
            postgres: '17'
          - netbox: 'v4.7.3'
            postgres: '15'
          - netbox: 'v4.7.3'
            postgres: '17'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          path: netbox-backup
      - uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          pip install -r netbox/requirements.txt
          pip install -e "netbox-backup[all]" moto
      - name: Test
        working-directory: netbox/netbox
        env:
          PYTHONPATH: ${{ github.workspace }}/netbox-backup/testing
          NETBOX_CONFIGURATION: netbox_backup_testing
        run: |
          set -o pipefail
          python manage.py makemigrations netbox_backup --check --dry-run
          python manage.py test netbox_backup --noinput -v 2 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure()
        run: python netbox-backup/.github/scripts/annotate_failures.py "$RUNNER_TEMP/test.log"
