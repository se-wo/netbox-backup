name: CI

on:
  # Branch pushes are covered by pull_request; push runs only for main, so a PR commit runs CI once
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its superseded run; runs on main always finish
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pg_dump refuses to dump a newer server, so the client tracks the newest PostgreSQL in the matrix
  PG_CLIENT: '18'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check netbox_backup .github/scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each supported NetBox release against PostgreSQL 15 (NetBox 4.7's minimum) and the newest major
          - netbox: 'v4.6.10'
            postgres: '15'
          - netbox: 'v4.6.10'
            postgres: '18'
          - netbox: 'v4.7.3'
            postgres: '15'
          - netbox: 'v4.7.3'
            postgres: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          PGUSER: postgres  # for the health check; pg_isready would otherwise log in as root
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      NETBOX_DB_USER: nbb_owner
      NETBOX_DB_PASSWORD: nbb_owner
      NBB_TEST_AZURITE: '1'
      NBB_TEST_GCS_ENDPOINT: 'http://127.0.0.1:4443'
    steps:
      - uses: actions/checkout@v7
        with:
          path: netbox-backup
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client, GnuPG, OpenSSH server and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common gnupg openssh-server rclone
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$PG_CLIENT"
          echo "/usr/lib/postgresql/$PG_CLIENT/bin" >> "$GITHUB_PATH"
          gpg --version | head -2
          rclone version | head -1
      - name: Non-superuser database owner, as on a shared PaaS server
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE nbb_owner LOGIN PASSWORD 'nbb_owner' NOSUPERUSER CREATEDB"
          psql -h localhost -U postgres -c "CREATE DATABASE netbox OWNER nbb_owner"
      - name: Azurite and fake-gcs-server
        run: |
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          docker run -d -p 4443:4443 fsouza/fake-gcs-server:1.52.2 -scheme http -port 4443 \
            -public-host 127.0.0.1:4443
      - name: Install
        run: |
          pip install -r netbox/requirements.txt
          pip install -e "netbox-backup[all]" moto
      - name: Test
        working-directory: netbox/netbox
        env:
          PYTHONPATH: ${{ github.workspace }}/netbox-backup/testing
          NETBOX_CONFIGURATION: netbox_backup_testing
        run: |
          set -o pipefail
          python manage.py makemigrations netbox_backup --check --dry-run
          python manage.py test netbox_backup --noinput -v 2 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure()
        run: python netbox-backup/.github/scripts/annotate_failures.py "$RUNNER_TEMP/test.log"

  upgrade-restore:
    # Back up on the oldest supported NetBox and restore into an empty database on the newest
    name: restore ${{ matrix.from }} set on ${{ matrix.to }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: 'v4.6.10'
            to: 'v4.7.3'
            postgres: '17'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          PGUSER: postgres  # for the health check; pg_isready would otherwise log in as root
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      PGHOST: localhost
      PGUSER: nbb_owner
      PGPASSWORD: nbb_owner
      NETBOX_DB_USER: nbb_owner
      NETBOX_DB_PASSWORD: nbb_owner
    steps:
      - uses: actions/checkout@v7
        with:
          path: netbox-backup
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.from }}
          path: netbox-old
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.to }}
          path: netbox-new
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$PG_CLIENT"
          echo "/usr/lib/postgresql/$PG_CLIENT/bin" >> "$GITHUB_PATH"
      - name: Non-superuser database owner
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -c "CREATE ROLE nbb_owner LOGIN PASSWORD 'nbb_owner' NOSUPERUSER CREATEDB"
      - name: Install both NetBox releases
        run: |
          for side in old new; do
            python -m venv "venv-$side"
            "venv-$side/bin/pip" install -r "netbox-$side/requirements.txt"
            "venv-$side/bin/pip" install -e "netbox-backup[all]"
          done
      - name: Back up on ${{ matrix.from }}, restore on ${{ matrix.to }}
        env:
          OLD_NETBOX: ${{ github.workspace }}/netbox-old
          NEW_NETBOX: ${{ github.workspace }}/netbox-new
          OLD_PYTHON: ${{ github.workspace }}/venv-old/bin/python
          NEW_PYTHON: ${{ github.workspace }}/venv-new/bin/python
          PLUGIN_DIR: ${{ github.workspace }}/netbox-backup
        run: netbox-backup/.github/scripts/cross_version_restore.sh
