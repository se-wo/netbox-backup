{% extends 'generic/object_list.html' %}
{% load i18n %}

{% block extra_controls %}
  <a href="{% url 'plugins:netbox_backup:status' %}" class="btn btn-outline-secondary">
    <i class="mdi mdi-heart-pulse"></i> {% trans "Status" %}
  </a>
  {% if perms.netbox_backup.run_backup %}
    <form action="{% url 'plugins:netbox_backup:backup_sync' %}" method="post" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-secondary" title="{% trans 'Rebuild the catalog from the manifests in storage' %}">
        <i class="mdi mdi-sync"></i> {% trans "Sync from storage" %}
      </button>
    </form>
    <a href="{% url 'plugins:netbox_backup:backup_run' %}" class="btn btn-primary">
      <i class="mdi mdi-play"></i> {% trans "Run backup" %}
    </a>
  {% endif %}
{% endblock %}
